<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Lesson 15 </title>
        <style>
            body {
                height: 3000px;
            }

            .product{
                position: relative;
                display: inline-block;
            }

            .image {
                width: 300px;
                height: 300px;
                object-fit: cover;
            }

            .offer {
                position: absolute;
                top: 10px;
                right: 0px;
                background-color: black;
                color: white;
                font-family: Arial;
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 12px;
                padding-right: 12px;
            }
        </style>
    </head>
    <body>
        <div class="product">
            <img class="image" src="shirt.png">
            <div class="offer"> 20% OFF </div>
        </div>
    </body>
</html>
