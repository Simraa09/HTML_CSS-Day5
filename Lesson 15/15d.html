<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Lesson 15 </title>
        <style>
            body {
                height: 3000px;
            }

            .box {
                background-color: gray;
                position: fixed;
                bottom: 15px;
                right: 15px;
                width: 320px;
                height: 180px;
            }

            .close {
                background-color: black;
                color: white;
                position: fixed;
                bottom: 180px;
                right: 320px;
                font-family: Arial;
                width: 40px;
                height: 40px;
                border-radius: 25px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .time {
                background-color: black;
                color: white;
                position: absolute;
                bottom: 20px;
                right: 20px;
                font-family: Arial;
                font-size: 18px;
                padding-top: 5px;
                padding-bottom: 5px;
                padding-left: 10px;
                padding-right: 10px;
            }
        </style>
    </head>
    <body>
        <div class="box"></div>
        <div class="close"> X </div>
        <div class="time"> 0:29 </div>
    </body>
</html>
