<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Lesson 16</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: Roboto, Arial;
            }

            .header {
                height: 55px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 20px;
                border-bottom: 1px solid #ddd;
            }

            .left-section {
                display: flex;
                align-items: center;
            }

            .hamburger-menu {
                width: 24px;
                margin-right: 25px;
            }

            .logo {
                width: 90px;
            }

            .middle-section {
                display: flex;
                align-items: center;
                flex: 1;
                max-width: 600px;
                margin-left: 50px;
            }

            .search-bar {
                height: 36px;
                flex: 1;
                border: 1px solid #ccc;
                padding-left: 12px;
                font-size: 16px;
            }

            .search-button {
                height: 40px;
                width: 64px;
                border: 1px solid #ccc;
                background-color: #f8f8f8;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
            }

            .search-icon {
                width: 24px;
            }

            .voice-button {
                height: 40px;
                width: 40px;
                border: none;
                border-radius: 50%;
                margin-left: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
            }

            .voice-icon {
                width: 24px;
            }

            .right-section {
                display: flex;
                align-items: center;
                gap: 25px;
            }

            .upload-container,
            .apps-container,
            .notifications-container {
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
            }

            .upload-icon,
            .apps-icon,
            .notifications-icon {
                width: 24px;
            }

            .notifications-count {
                position: absolute;
                top: -5px;
                right: -5px;
                background-color: red;
                color: white;
                font-size: 10px;
                padding: 2px 5px;
                border-radius: 50%;
            }

            .dp {
                width: 35px;
                height: 35px;
                border-radius: 50%;
            }

            .search-button .tooltip,
            .voice-button .tooltip,
            .upload-container .tooltip,
            .apps-container .tooltip,
            .notifications-container .tooltip {
                font-family: Roboto, Arial;
                position: absolute;
                background-color: gray;
                color: white;
                padding-top: 4px;
                padding-bottom: 4px;
                padding-left: 8px;
                padding-right: 8px;
                border-radius: 2px;
                font-size: 12px;
                bottom: -30px;
                opacity: 0;
                transition: opacity 0.15s;
                pointer-events: none;
                white-space: nowrap;
                z-index: 100;
            }

            .search-button:hover .tooltip,
            .voice-button:hover .tooltip,
            .upload-container:hover .tooltip,
            .apps-container:hover .tooltip,
            .notifications-container:hover .tooltip {
                opacity: 1;
            }

            .video-grid {
                display: grid;
                grid-template-columns: 300px 300px;
                gap: 20px;
                margin-left: 20px;
                margin-top: 20px;
            }

            .video-preview {
                width: 300px;
            }

            .thumbnail {
                width: 300px;
                display: block;
            }

            .video-info {
                display: grid;
                grid-template-columns: 50px 1fr;
                margin-top: 10px;
            }

            .channel {
                position: relative;
                display: inline-block;
            }

            .profile {
                width: 40px;
                height: 40px;
                border-radius: 50%;
            }

            .channel-tooltip {
                position: absolute;
                display: flex;
                align-items: center;
                background-color: white;
                width: 230px;
                padding: 15px;
                border-radius: 8px;
                box-shadow: 0 2px 8px gray;
                left: 0;
                top: 50px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s;
                z-index: 100;
            }

            .channel:hover .channel-tooltip {
                opacity: 1;
            }

            .channel-tooltip img {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                margin-right: 12px;
            }

            .channel-info b {
                font-size: 16px;
            }

            .channel-info p {
                color: gray;
                margin: 5px 0 0;
            }

            .video-text {
                padding-left: 5px;
            }

            .video-title-link {
                color: black;
                text-decoration: none;
            }

            .video-title {
                font-size: 16px;
                font-weight: bold;
                line-height: 22px;
                margin: 0 0 10px 0;
            }

            .youtuber {
                color: gray;
                font-size: 14px;
                margin: 0 0 5px 0;
            }

            .stats {
                color: gray;
                font-size: 14px;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="left-section">
                <img class="hamburger-menu" src="header icons/hamburger-menu.png">
                <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg">
            </div>
            <div class="middle-section">
                <input class="search-bar" type="text" placeholder="Search">
                <button class="search-button">
                    <img class="search-icon" src="header icons/search.png">
                    <div class="tooltip">Search</div>
                </button>
                <button class="voice-button">
                    <img class="voice-icon" src="header icons/voice-search.png">
                    <div class="tooltip">Search with your voice</div>
                </button>
            </div>
            <div class="right-section">
                <div class="upload-container">
                    <img class="upload-icon" src="header icons/upload.png">
                    <div class="tooltip">Create</div>
                </div>
                <div class="apps-container">
                    <img class="apps-icon" src="header icons/apps.png">
                    <div class="tooltip">YouTube Apps</div>
                </div>
                <div class="notifications-container">
                    <img class="notifications-icon" src="header icons/notification.png">
                    <div class="notifications-count">2</div>
                    <div class="tooltip">Notifications</div>
                </div>
                <img class="dp" src="header icons/cat.png">
            </div>
        </div>

        <div class="video-grid">
            <div class="video-preview">
                <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY" target="_blank">
                    <img class="thumbnail" src="video images/thumbnail-1.webp">
                </a>
                <div class="video-info">
                    <div class="channel">
                        <img class="profile" src="video images/channel-1.jpeg">
                        <div class="channel-tooltip">
                            <img src="video images/channel-1.jpeg">
                            <div class="channel-info">
                                <b>Marques Brownlee</b>
                                <p>15M subscribers</p>
                            </div>
                        </div>
                    </div>
                    <div class="video-text">
                        <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY" target="_blank" class="video-title-link">
                            <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichai!</p>
                        </a>
                        <p class="youtuber">Marques Brownlee</p>
                        <p class="stats">3.4M views · 6 months ago</p>
                    </div>
                </div>
            </div>

            <div class="video-preview">
                <a href="https://youtu.be/AB3J8ufDYHQ" target="_blank">
                    <img class="thumbnail" src="video images/thumbnail-2.webp">
                </a>
                <div class="video-info">
                    <div class="channel">
                        <img class="profile" src="video images/channel-2.jpeg">
                        <div class="channel-tooltip">
                            <img src="video images/channel-2.jpeg">
                            <div class="channel-info">
                                <b>CodeWithHarry</b>
                                <p>Subscribers</p>
                            </div>
                        </div>
                    </div>
                    <div class="video-text">
                        <a href="https://youtu.be/AB3J8ufDYHQ" target="_blank" class="video-title-link">
                            <p class="video-title">Git Tutorial for Beginners: Learn Git in One Video</p>
                        </a>
                        <p class="youtuber">CodeWithHarry</p>
                        <p class="stats">19M views · 4 years ago</p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
