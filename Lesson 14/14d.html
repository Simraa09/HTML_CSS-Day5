<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Lesson 14 </title>
        <style>
            body {
                height: 3000px;
            }

            .right-sidebar {
                background-color: green;
                color: white;
                position: fixed;
                right: 0;
                top: 0;
                bottom: 0;
                width: 100px;
            }

            .overlay {
                background-color: rgba(0, 0, 0, 0.5);
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .modal {
                background-color: white;
                width: 300px;
                padding-top: 15px;
                padding-bottom: 15px;
                padding-left: 15px;
                padding-right: 15px;
                border-radius: 5px;
            }

            .title {
                font-family: Arial;
                font-weight: bold;
                font-size: 24px;
                margin-bottom: 12px;
            }

            .text {
                font-family: Arial;
                margin-bottom: 12px;
            }
            
        </style>
    </head>
    <body>
        <div class="right-sidebar"> Right sidebar </div>
        <div class="overlay">
        <div class="modal">
            <div class="title"> Modal Title </div>
            <div class="text"> This is a modal </div>
            <button> Close </button>
      </div>
    </div>
    </body>
</html>
