<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Lesson 14 </title>
        <style>
            body {
                height: 3000px;
            }

            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 50px;
                padding-right: 50px;
            }

            .left{
                display: flex;
                align-items: center;
            }

            .dp{
                width: 40px;
                height: 40px;
                object-fit: cover;
                border-radius: 20px;
                margin-right: 10px;
            }

            .name{
                font-weight: bold;
                font-family: Arial;
                }

            .add{
                background-color: rgb(24, 119, 242);
                color: white;
                font-weight: bold;
                border: none;
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 12px;
                padding-right: 12px;
                border-radius: 6px;
                margin-right: 3px;
            }

            .message{
                background-color: rgb(230, 230, 230);
                border: none;
                font-weight: bold;
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 12px;
                padding-right: 12px;
                border-radius: 6px;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="left">
                <img class="dp" src="cat.png">
                <div class="name">Oliver Cat</div>
            </div>
            <div class="right">
                <button class="add">Add Friend</button>
                <button class="message">Message</button>
            </div>
        </div>
    </body>
</html>
