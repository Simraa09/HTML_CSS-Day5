<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Lesson 13</title>
        <style>
            .container{
                border: solid;
                border-radius: 5px;
                border-color: rgb(175, 175, 175);
                border-width: 2px;
                font-family: Arial, Helvetica, sans-serif;
                padding-left: 15px;
                padding-top: 8px;
                padding-bottom: 8px;
                width: 460px;
                height: 130px;
                color: gray;
            }

            .main-1{
                font-size: 14px;
            }

            .main-2{
                display: flex;
                flex-direction: row;
                margin-top: 20px;
                padding-right: 0px;
                padding-left: 0px;
                padding-top: 0px;
                padding-bottom: 0px;
            }

            .info-container{
                margin-left: 12px;
                margin-right: 0px;
            }

            .dp{
                width: 60px;
                height: 60px;
                border-radius: 50px;
            }

            .title-time{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
            }

            .title{
                font-weight: bolder;
                color: black;
                font-size: 19px;
            }

            .time{
                font-size: 15px;
            }

            .subtitle{
                color: black;
                font-weight: bolder;
                line-height: 28px;
                font-size: 17px;
            }

            .text{
                line-height: 18px;
            }
        </style>
    </head>
    <body>
        <img src="13c.png" style="width:550px;">
        <div class="container">
            <div class="main-1"> ALL INBOXES </div>
            <div class="main-2">
                <div>
                    <img src="cat.png" class="dp">
                </div>
                <div class="info-container">
                    <div class="title-time">
                        <div class="title">
                            Chewy Promotions
                        </div>
                        <div class="time">
                            4:58 PM
                        </div>
                    </div>
                    <div class="subtitle">
                        Biggest sales of the year!
                    </div>
                    <div class="text">
                        Hey there! We're writing to tell you aboout our... &emsp;&emsp;
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
